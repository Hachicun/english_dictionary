<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thử giọng Web Speech</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --accent: #2563eb; --border: #e3e6ec; --ok: #15803d; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1c212b; --text: #e8ebf1; --muted: #9aa3b2;
      --accent: #60a5fa; --border: #2b3240; --ok: #4ade80; --warn: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --card: #1c212b; --text: #e8ebf1; --muted: #9aa3b2;
    --accent: #60a5fa; --border: #2b3240; --ok: #4ade80; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px; padding-bottom: 40px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  p.hint { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin-bottom: 14px;
  }
  input[type=text], select {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; min-height: 44px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 36px; padding: 6px 10px; font-size: 14px; }
  .voice {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .voice:last-child { border-bottom: 0; }
  .voice .name { font-weight: 600; word-break: break-word; }
  .voice .meta { font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 6px; margin-left: 4px; border: 1px solid var(--border); }
  .tag.local { color: var(--ok); }
  .tag.net { color: var(--warn); }
  .empty { color: var(--muted); font-size: 14px; }
  label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 4px; }
  .range { width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Thử giọng Web Speech</h1>
  <p class="hint">Nghe từ bằng từng giọng có trên máy bạn. Chạm vào nút Nghe để phát.</p>

  <div class="card">
    <label for="word">Từ cần đọc</label>
    <input type="text" id="word" value="read" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="chips" style="margin-top:10px" id="chips"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div style="flex:1; min-width:180px">
        <label for="rate">Tốc độ: <span id="rateVal">1.0</span>×</label>
        <input type="range" class="range" id="rate" min="0.5" max="1.2" step="0.05" value="1">
      </div>
      <button class="primary" id="playDefault">Nghe giọng mặc định</button>
    </div>
    <p class="hint" style="margin-bottom:0">Giọng mặc định: <span id="defaultName">đang tải…</span></p>
  </div>

  <div class="card">
    <h2>Các giọng trên máy này</h2>
    <p class="hint" style="margin-top:0">Nhãn <span class="tag local">local</span> là giọng chạy trên máy (dùng được offline). <span class="tag net">mạng</span> là giọng cần internet.</p>
    <div id="voices"><p class="empty">Đang tải danh sách giọng…</p></div>
  </div>

  <div class="card">
    <h2>Thông tin trình duyệt</h2>
    <div id="info" class="empty"></div>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var supported = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  var voices = [];

  var samples = ['read', 'lead', 'wind', 'live', 'water', 'schedule', 'comfortable', 'through', 'thought', 'colonel'];

  function speak(text, voice) {
    if (!supported) return false;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = parseFloat($('rate').value) || 1;
      u.lang = 'en-US';
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) {
      alert('Không phát được: ' + e.message);
      return false;
    }
  }

  function pickDefault() {
    var list = voices.filter(function (v) { return /^en[-_]US/i.test(v.lang); });
    var local = list.filter(function (v) { return v.localService; });
    return local[0] || list[0] || voices.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }

  function renderChips() {
    var box = $('chips');
    box.innerHTML = '';
    samples.forEach(function (w) {
      var b = document.createElement('button');
      b.textContent = w;
      b.onclick = function () { $('word').value = w; };
      box.appendChild(b);
    });
  }

  function renderVoices() {
    var box = $('voices');
    box.innerHTML = '';
    if (!voices.length) {
      box.innerHTML = '<p class="empty">Không có giọng nào. Trên một số máy, giọng chỉ hiện sau khi chạm vào trang hoặc tải lại trang.</p>';
      return;
    }
    var sorted = voices.slice().sort(function (a, b) {
      var ea = /^en/i.test(a.lang) ? 0 : 1, eb = /^en/i.test(b.lang) ? 0 : 1;
      if (ea !== eb) return ea - eb;
      return (a.lang + a.name).localeCompare(b.lang + b.name);
    });
    sorted.forEach(function (v) {
      var row = document.createElement('div');
      row.className = 'voice';
      var info = document.createElement('div');
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = v.name;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = v.lang + ' <span class="tag ' + (v.localService ? 'local' : 'net') + '">' +
        (v.localService ? 'local' : 'mạng') + '</span>' +
        (v.default ? ' <span class="tag">mặc định</span>' : '');
      info.appendChild(name);
      info.appendChild(meta);
      var btn = document.createElement('button');
      btn.textContent = 'Nghe';
      btn.onclick = function () { speak($('word').value.trim() || 'read', v); };
      row.appendChild(info);
      row.appendChild(btn);
      box.appendChild(row);
    });
  }

  function renderInfo() {
    var ua = navigator.userAgent;
    var platform = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'macOS' : /Windows/.test(ua) ? 'Windows' : 'Khác';
    var en = voices.filter(function (v) { return /^en/i.test(v.lang); }).length;
    $('info').innerHTML =
      'Hệ điều hành: ' + platform + '<br>' +
      'Hỗ trợ Web Speech: ' + (supported ? 'có' : 'KHÔNG') + '<br>' +
      'Tổng số giọng: ' + voices.length + ' (giọng tiếng Anh: ' + en + ')';
  }

  function refresh() {
    voices = supported ? window.speechSynthesis.getVoices() : [];
    var d = pickDefault();
    $('defaultName').textContent = d ? (d.name + ' (' + d.lang + ')') : 'không có giọng tiếng Anh';
    $('playDefault').disabled = !d;
    renderVoices();
    renderInfo();
  }

  if (!supported) {
    $('defaultName').textContent = 'trình duyệt không hỗ trợ';
    $('playDefault').disabled = true;
    $('voices').innerHTML = '<p class="empty">Trình duyệt này không hỗ trợ Web Speech.</p>';
    renderInfo();
  } else {
    refresh();
    try { window.speechSynthesis.onvoiceschanged = refresh; } catch (e) {}
    setTimeout(refresh, 800);
  }

  $('playDefault').onclick = function () {
    var d = pickDefault();
    speak($('word').value.trim() || 'read', d);
  };
  $('rate').oninput = function () { $('rateVal').textContent = parseFloat(this.value).toFixed(2); };
  $('word').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('playDefault').click();
  });

  renderChips();
})();
</script>
</body>
</html>
